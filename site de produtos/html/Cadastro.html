<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Cadastro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../Css/form.css">
</head>

<body>
<form action="Cards.html" method="get">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card formulario shadow p-4">

                    <h2 class="text-center mb-4">
                        Criar perfil 
                    </h2>

                   

                        <div class="mb-3">
                            <label for="nome" class="form-label">
                                Nome completo
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                name="nome"
                                placeholder="Digite seu nome"
                                required>
                                
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                E-mail
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Digite seu e-mail"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label">
                                Telefone
                            </label>
                            <input
                                type="tel"
                                class="form-control"
                                id="telefone"
                                name="telefone"
                                placeholder="(00) 00000-0000"
                                minlength="10"
                                
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">
                                Senha
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                name="senha"
                                placeholder="Crie uma senha"
                         minlength="8"     required>
                        </div>
                        <div class="mb-4">
        <label for="data" class="data">Data de Nascimento</label>
        <input type="date" class="form-control"
                                id="data"
                                name="data"
                                placeholder="Data de nascimento"
                             required>
    </div>

                        <button type="submit"
                            class="btn btn-azul w-80 py-3 mb-2" >
                            Cadastrar
                        </button>
                  
                        <button type="reset" class="btn btn-danger w-100 py-3 mb-2">
    Limpar
</button>

                    </form>

                </div>

            </div>
        </div>
    </div>
    
    <body>
        
    
    <main class="conteudo">
        <div class="container">
         
        </div>
    </main>

    <footer>
        Portal dos Celulares & Tecnologia
    </footer>

</form>
</body>
</html>
