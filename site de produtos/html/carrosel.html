<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Carrossel</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../Css/carrosel.css" />
  </head>

  <body>
    <h1 class="text-center mt-5">Notebooks</h1>

    <div id="carrossel" class="carousel slide container mt-5">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="../imagens/LHpevCmsam11waMTX59RZj26BXqoLu-metaNjFRcXJDbkd5ZkwuX0FDX1NYNjc5Xy5qcGc=-_principal.png"
            class="d-block w-100"
          />
        </div>

        <div class="carousel-item">
          <img src="../imagens/184.png" class="d-block w-100" />
        </div>

        <div class="carousel-item">
          <img
            src="../imagens/167513-800-auto.webp"
            class="d-block w-100"
          />
        </div>
      </div>

      <button
        class="carousel-control-prev"
        data-bs-target="#carrossel"
        data-bs-slide="prev" >
        <span class="carousel-control-prev-icon"></span>
      </button>

  <button
        class="carousel-control-next"
        data-bs-target="#carrossel"
        data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <footer class="rodape">
    <p>Portal da Tecnologia</p>
 
</footer>
  </body>
</html>
