<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tabela</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../Css/table.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- 1. d-flex flex-column min-vh-100 prepara o corpo para empurrar o footer -->
<body class="d-flex flex-column min-vh-100">

    <!-- 2. Adicionado container para organizar as margens e o espaçamento lateral -->
    <div class="container my-4 flex-grow-1">
        <h1>Comparação de Produtos</h1>

        <div class="table-responsive table-card">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Marca</th>
                        <th scope="col">Preço</th>
                        <th scope="col">Qualidade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Samsung galaxy-s25</td>
                        <td>2.499,00</td>
                        <td>★★★★★</td>
                    </tr>
                    <tr>
                        <th scope="row">2</th>
                        <td>Iphone</td>
                        <td>4.900,00</td>
                        <td>★★★★★</td>
                    </tr>
                    <tr>
                        <th scope="row">3</th>
                        <td>Motorola</td>
                        <td>R$ 1.799,00</td>
                        <td>★★★</td>
                    </tr>
                    <tr>
                        <th scope="row">4</th>
                        <td>Notebook lenovo</td>
                        <td>R$ 3.000,00</td>
                        <td>★★★★</td>
                    </tr>

                     <tr>
                        <th scope="row">5</th>
                        <td>Notebook Acer</td>
                        <td>R$ 2.999,00</td>
                        <td>★★★★</td>
                    </tr>
                    <tr>
                        <th scope="row">6</th>
                        <td>Notebook Dell</td>
                        <td>R$ 2.299,00</td>
                        <td>★★★★</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- O footer agora fica isolado no final devido à estrutura flex -->
    <footer class="bg-dark text-white text-center p-4">
        <p class="mb-0">Portal dos Celulares & Tecnologia</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
